name: US Stock Market Scanner

on:
  schedule:
    # التشغيل كل دقيقة واحدة من 2:00 PM إلى 9:00 PM UTC (5 مساءً إلى 12 منتصف الليل بتوقيت السعودية)
    - cron: '*/1 14-21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ✅ العملية الأولى: الرد على الرسائل (سريعة جداً)
  reply-messages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot Commands
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MODE: commands
        run: python bot.py

  # ✅ العملية الثانية: إرسال التقارير (تعمل بالتوازي)
  send-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stock Scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          RUN_MODE: scan
        run: python bot.py

      - name: Save all data files
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@github.com'
          git add -A
          git diff --staged --quiet || (git commit -m "🤖 Save bot data [skip ci]" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
